    {"notice": "직접 상표출원 대리 가능한 변리업체 대상 상표출원 용역 입찰", "relevant": true, "participation_type": "입찰 참여자"},
    {"notice": "중소기업만 신청하는 해외특허 출원 비용 지원 수혜기업 모집", "relevant": false, "participation_type": "수혜기업"},
    {"notice": "일반 행사 운영 용역이며 특허업무/변리업체 참여 근거 없음", "relevant": false, "participation_type": "해당없음"},
    {"notice": "IP 지원사업 제목만 있고 모집 주체/요건은 첨부에만 있음", "relevant": false, "participation_type": "불명확"}
