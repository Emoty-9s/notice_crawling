{
  "name": "Diagnose exportvoucher curl and urllib (metadata only)",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "exportvoucher-connectivity-diagnostic",
    "cancel-in-progress": false
  },
  "jobs": {
    "diagnose": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 18,
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Direct public GET comparison; no bodies or cookies persisted",
          "shell": "bash",
          "run": "mkdir -p .run\ncat > .run/connectivity_diagnostic.py <<'PY'\nimport http.client,json,os,signal,socket,ssl,subprocess,sys,time\nfrom http.cookiejar import CookieJar\nfrom pathlib import Path\nfrom urllib.error import HTTPError,URLError\nfrom urllib.request import Request,build_opener,HTTPCookieProcessor,HTTPRedirectHandler,ProxyHandler\n\nBASE='https://www.exportvoucher.com/portal/board/'\nURLS={'list':BASE+'boardList?bbs_id=1','detail':BASE+'boardView?bbs_id=1&ntt_id=13038'}\nGAP=5\nlast=None\n\ndef pace():\n    global last\n    if last is not None: time.sleep(max(0,GAP-(time.monotonic()-last)))\n\ndef error_kind(error):\n    root=error.reason if isinstance(error,URLError) else error\n    if isinstance(root,TimeoutError): return 'TIMEOUT'\n    if isinstance(root,ssl.SSLCertVerificationError): return 'TLS_CERTIFICATE'\n    if isinstance(root,ConnectionResetError): return 'CONNECTION_RESET'\n    if isinstance(root,socket.gaierror): return 'DNS_ERROR'\n    if isinstance(root,ssl.SSLError): return 'TLS_ERROR'\n    return type(root).__name__\n\ndef blank(client,scenario,target,attempt):\n    return dict(client=client,scenario=scenario,target=target,attempt=attempt,http_status=None,\n                dns='NOT_REACHED',tcp='NOT_REACHED',tls='NOT_REACHED',received_bytes=0,\n                elapsed_seconds=0,error=None,timeout=False,redirect=False)\n\nclass NoRedirect(HTTPRedirectHandler):\n    def redirect_request(self,*args,**kwargs): return None\n\ndef python_worker(scenario,targets):\n    global last\n    jar=CookieJar()\n    opener=build_opener(ProxyHandler({}),HTTPCookieProcessor(jar),NoRedirect())\n    active=None\n    deadline=0\n    original_dns=socket.getaddrinfo\n    original_tcp=socket.create_connection\n    original_tls=ssl.SSLContext.wrap_socket\n    original_connect=http.client.HTTPSConnection.connect\n    def dns(*args,**kwargs):\n        active['dns']='FAILED'\n        result=original_dns(*args,**kwargs)\n        active['dns']='SUCCESS'\n        return result\n    def tcp(*args,**kwargs):\n        try:\n            result=original_tcp(*args,**kwargs)\n            active['tcp']='SUCCESS'\n            return result\n        except Exception:\n            if active['dns']=='SUCCESS': active['tcp']='FAILED'\n            raise\n    def tls(*args,**kwargs):\n        active['tls']='FAILED'\n        result=original_tls(*args,**kwargs)\n        active['tls']='SUCCESS'\n        return result\n    def alarm(*args): raise TimeoutError()\n    def connect(connection):\n        signal.setitimer(signal.ITIMER_REAL,max(.001,min(15,deadline-time.monotonic())))\n        try: return original_connect(connection)\n        finally: signal.setitimer(signal.ITIMER_REAL,max(.001,deadline-time.monotonic()))\n    signal.signal(signal.SIGALRM,alarm)\n    socket.getaddrinfo=dns\n    socket.create_connection=tcp\n    ssl.SSLContext.wrap_socket=tls\n    http.client.HTTPSConnection.connect=connect\n    rows=[]\n    for target in targets:\n        pace()\n        started=time.monotonic()\n        deadline=started+30\n        for attempt in (1,2):\n            if attempt==2:\n                if deadline-time.monotonic()<=GAP: break\n                pace()\n                if time.monotonic()>=deadline: break\n            active=blank('urllib',scenario,target,attempt)\n            began=time.monotonic()\n            signal.setitimer(signal.ITIMER_REAL,max(.001,deadline-began))\n            response=None\n            try:\n                try: response=opener.open(Request(URLS[target]),timeout=min(15,deadline-began))\n                except HTTPError as e: response=e\n                active['http_status']=response.code\n                active['redirect']=300<=response.code<400\n                while True:\n                    chunk=response.read1(65536)\n                    if not chunk: break\n                    active['received_bytes']+=len(chunk)\n                if response.code>=400: active['error']='HTTP_STATUS'\n            except Exception as error:\n                active['error']=error_kind(error)\n                active['timeout']=active['error']=='TIMEOUT'\n            finally:\n                signal.setitimer(signal.ITIMER_REAL,0)\n                if response is not None: response.close()\n                active['elapsed_seconds']=round(time.monotonic()-began,3)\n                rows.append(active)\n                last=time.monotonic()\n            if not active['error'] or active['http_status'] is not None or active['error']=='TLS_CERTIFICATE': break\n    print(json.dumps(rows))\n\ndef curl_group(scenario,targets):\n    global last\n    jar=''  # Cookies are passed through pipes; no cookie files or log output.\n    rows=[]\n    for target in targets:\n        pace()\n        deadline=time.monotonic()+30\n        for attempt in (1,2):\n            if attempt==2:\n                if deadline-time.monotonic()<=GAP: break\n                pace()\n                if time.monotonic()>=deadline: break\n            rec=blank('curl',scenario,target,attempt)\n            began=time.monotonic()\n            remaining=max(.05,deadline-began)\n            command=['curl','--silent','--noproxy','*',\n                     '--connect-timeout',str(min(15,remaining)),\n                     '--max-time',str(max(.01,remaining-.2)),\n                     '--output','/dev/null','--cookie','/dev/stdin','--cookie-jar','/dev/stdout',\n                     '--write-out','%{stderr}DIAG_META:{\"http_code\":%{http_code},\"size_download\":%{size_download},\"time_namelookup\":%{time_namelookup},\"time_connect\":%{time_connect},\"time_appconnect\":%{time_appconnect}}\\n',URLS[target]]\n            try:\n                result=subprocess.run(command,input=jar,text=True,capture_output=True,timeout=remaining)\n                lines=result.stderr.splitlines()\n                metadata=next((json.loads(line[len('DIAG_META:'):]) for line in lines if line.startswith('DIAG_META:')),None)\n                jar=result.stdout\n                if metadata is not None:\n                    code=metadata.get('http_code',0)\n                    rec.update(http_status=code or None,received_bytes=int(metadata.get('size_download',0)),\n                               redirect=300<=code<400)\n                    for field,key in (('dns','time_namelookup'),('tcp','time_connect'),('tls','time_appconnect')):\n                        if metadata.get(key,0)>0: rec[field]='SUCCESS'\n                    if rec['dns']!='SUCCESS': rec['dns']='FAILED'\n                    elif rec['tcp']!='SUCCESS': rec['tcp']='FAILED'\n                    elif rec['tls']!='SUCCESS': rec['tls']='FAILED'\n                else:\n                    rec.update(received_bytes=None,error='CURL_METADATA_UNAVAILABLE')\n                if result.returncode:\n                    rec['error']={6:'DNS_ERROR',7:'TCP_CONNECT',28:'TIMEOUT',35:'TLS_CONNECT',\n                                  60:'TLS_CERTIFICATE',56:'RECEIVE_ERROR'}.get(result.returncode,'CURL_'+str(result.returncode))\n                    rec['timeout']=result.returncode==28\n                elif (rec['http_status'] or 0)>=400: rec['error']='HTTP_STATUS'\n            except ValueError:\n                rec.update(error='CURL_METADATA_INVALID',received_bytes=None)\n            except subprocess.TimeoutExpired:\n                rec.update(error='TOTAL_TIMEOUT',timeout=True,received_bytes=None)\n            rec['elapsed_seconds']=round(time.monotonic()-began,3)\n            rows.append(rec)\n            last=time.monotonic()\n            if not rec['error'] or rec['http_status'] is not None or rec['error'] in {'TLS_CERTIFICATE','CURL_METADATA_UNAVAILABLE','CURL_METADATA_INVALID'}: break\n    return rows\n\ndef main():\n    global last\n    rows=[]\n    scenarios=[('direct_list',['list']),('direct_detail',['detail']),\n               ('detail_first',['detail','list']),('same_session_list_detail',['list','detail'])]\n    for scenario,targets in scenarios:\n        for client in ('curl','urllib'):\n            if client=='curl': rows.extend(curl_group(scenario,targets))\n            else:\n                pace()\n                try:\n                    result=subprocess.run([sys.executable,__file__,'--worker',scenario,*targets],\n                                          capture_output=True,text=True,timeout=len(targets)*30+(len(targets)-1)*GAP+2)\n                    rows.extend(json.loads(result.stdout))\n                except (subprocess.TimeoutExpired,ValueError):\n                    rows.append(dict(client=client,scenario=scenario,error='WORKER_LIMIT_OR_PROTOCOL_ERROR',\n                                     http_status=None,dns='UNKNOWN',tcp='UNKNOWN',tls='UNKNOWN',\n                                     received_bytes=None,elapsed_seconds=None,timeout=True,redirect=False))\n                last=time.monotonic()\n    Path('.run/connectivity-report.json').write_text(json.dumps(rows,indent=2)+'\\n',encoding='utf-8')\n    print(json.dumps(rows,indent=2))\n    with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:\n        out.write('|Client|Scenario|Target|Attempt|HTTP|DNS/TCP/TLS|Bytes|Seconds|Error|Timeout|Redirect|\\n|---|---|---|---|---|---|---|---|---|---|---|\\n')\n        for r in rows:\n            out.write('|'+ '|'.join(str(v) for v in (r['client'],r['scenario'],r.get('target','?'),r.get('attempt','?'),\n                r['http_status'],r['dns']+'/'+r['tcp']+'/'+r['tls'],r['received_bytes'],r['elapsed_seconds'],\n                r['error'],r['timeout'],r['redirect']))+'|\\n')\n\nif __name__=='__main__':\n    if len(sys.argv)>1: python_worker(sys.argv[2],sys.argv[3:])\n    else: main()\nPY\npython .run/connectivity_diagnostic.py"
        },
        {
          "name": "Upload metadata only",
          "if": "always()",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "exportvoucher-connectivity-${{ github.run_id }}",
            "path": ".run/connectivity-report.json",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
